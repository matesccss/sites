<script>
/* Mejora opcional: cierra un desplegable de temas cuando se abre
   otro, y al pulsar fuera. El menú funciona igual sin este script,
   ya que se apoya en <details> nativo y un checkbox en CSS puro. */
document.addEventListener("click", (e) => {

    document.querySelectorAll(".menu-dropdown[open]").forEach(d => {
        if (!d.contains(e.target)) d.removeAttribute("open");
    });

    if (!e.target.closest(".menu-inner")) {
        const check = document.getElementById("menuCheck");
        if (check) check.checked = false;
    }

});

document.querySelectorAll(".menu-dropdown > summary").forEach(s => {
    s.addEventListener("click", () => {
        document.querySelectorAll(".menu-dropdown[open]").forEach(d => {
            if (d !== s.parentElement) d.removeAttribute("open");
        });
    });
});
</script>
