<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../icons/icon.png">

    <title>CCSS II · Tema 5 · Vídeos</title>

    <link rel="stylesheet" href="../../styles.css">

</head>

<body>

    <div id="menu-container"></div>

    <script>

        fetch("../../menu.html")
            .then(response => response.text())
            .then(html => {

                document.getElementById("menu-container").innerHTML = html;

                document
                    .querySelectorAll("#menu-container a[href]")
                    .forEach(enlace => {

                        const href = enlace.getAttribute("href");

                        if (
                            href &&
                            !href.startsWith("http") &&
                            !href.startsWith("#")
                        ) {

                            enlace.href = "../../" + href;

                        }

                    });

            })
            .catch(error => {

                console.error("Error cargando el menú:", error);

            });

        </script>


    <section class="videos-header">
        <div class="videos-title">
            <span class="videos-icon">▶</span>
            <div>
                <span class="videos-label">TEMA 5</span>
                <h1>Vídeos propios · Límites, derivadas, continuidad y derivabilidad</h1>
            </div>
        </div>
        <p>Vídeos explicativos, ejercicios y preparación PAU</p>
    </section>

    <section class="videos-tema">

        <details class="video-section">
            <summary>🔲 Límites</summary>
            <div class="contenido">
                <div class="galeria-videos">

                    <div class="video-card">
                        <div class="video-container">
                            <iframe
                                src="https://drive.google.com/file/d/1smCu6aDtH6vEHXcZq7aOhE_a9OhL8hog/preview"
                                title="Límites. Teoría y ejercicios"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen>
                            </iframe>
                        </div>
                        <h3>✍️ ✍️ Teoría y ejercicios</h3>
                        <p>Vídeo explicativo de límites</p>
                    </div>

                </div>
            </div>
        </details>

        <details class="video-section">
            <summary>🔲 Continuidad</summary>
            <div class="contenido">
                <div class="galeria-videos">

                    <div class="video-card">
                        <div class="video-container">
                            <iframe
                                src="https://drive.google.com/file/d/1veDNcb_lQiwFN5-dv6prYmwYwGKggJ2x/preview"
                                title="Continuidad. Teoría y ejercicios"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen>
                            </iframe>
                        </div>
                        <h3>✍️ ✍️ Teoría y ejercicios</h3>
                        <p>Vídeo explicativo de continuidad</p>
                    </div>

                </div>
            </div>
        </details>

    </section>

<script>
document.querySelectorAll(".video-section").forEach((section) => {

    section.addEventListener("toggle", () => {

        if (section.open) {

            document.querySelectorAll(".video-section").forEach((other) => {
                if (other !== section) {
                    other.removeAttribute("open");
                }
            });

            setTimeout(() => {
                section.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 300);
        }

    });

});
</script>


</body>

</html>
